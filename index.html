<style>
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --ink:#1E2230; --muted:#5A6070;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171E; --surface:#1B1F28; --ink:#E7E5DF; --muted:#A3A8B4;
    --rubric:#E5707F; --lapis:#94B3E6; --rule:#2E3340; --chip:#232835;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171E; --surface:#1B1F28; --ink:#E7E5DF; --muted:#A3A8B4;
  --rubric:#E5707F; --lapis:#94B3E6; --rule:#2E3340; --chip:#232835;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 1rem)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.125rem;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--lapis);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{color:var(--rubric)}
:focus-visible{outline:2px solid var(--lapis);outline-offset:3px;border-radius:2px}
img{max-width:100%}

.layout{display:grid;grid-template-columns:16rem minmax(0,1fr);width:100%;max-width:72rem;margin:0 auto}

/* Índice lateral */
.tabula{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow-y:auto;padding:3rem 1.5rem 2rem 2rem;font-family:var(--sans);font-size:.98rem;border-right:1px solid var(--rule)}
.tabula .sig{font-family:var(--serif);font-size:1.15rem;font-weight:700;line-height:1.25;margin:0 0 1.75rem;color:var(--ink);text-decoration:none;display:block}
.tabula .sig small{display:block;font-weight:400;font-style:italic;color:var(--muted);font-size:.95rem}
.tabula ol{list-style:none;margin:0;padding:0}
.tabula li a{display:block;padding:.28rem 0 .28rem .8rem;color:var(--muted);text-decoration:none;border-left:2px solid transparent}
.tabula li a:hover{color:var(--ink)}
.tabula li a[aria-current="true"]{color:var(--rubric);border-left-color:var(--rubric)}
.tools{margin-top:2rem;display:flex;flex-direction:column;gap:.5rem}
.btn{font:inherit;font-family:var(--sans);font-size:.95rem;background:none;border:1px solid var(--rule);color:var(--ink);padding:.4rem .75rem;border-radius:3px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--muted)}

/* Contenido */
main{padding:3rem clamp(1.25rem,4vw,4rem) 5rem;min-width:0}
.col{max-width:44rem}

.hero{padding-bottom:2.5rem;border-bottom:1px solid var(--rule);margin-bottom:1rem}
.hero-head{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
.hero-photo{width:7.5rem;height:7.5rem;border-radius:50%;object-fit:cover;border:1px solid var(--rule)}
.hero h1{font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.05;font-weight:500;margin:0;letter-spacing:-.01em}
.hero .role{font-style:italic;color:var(--muted);font-size:1.3rem;margin:.4rem 0 0}
.resume{margin-top:2rem}
.resume p{margin:0 0 1rem}
.resume p:first-child::first-letter{float:left;font-size:4.6rem;line-height:.82;font-weight:700;color:var(--rubric);padding:.35rem .55rem 0 0}
.lines{font-family:var(--sans);display:flex;flex-wrap:wrap;gap:.35rem 1.25rem;margin-top:1.5rem;font-size:1rem}
.lines a{overflow-wrap:anywhere}

section{padding:2.75rem 0 .5rem}
h2{font-size:1.75rem;font-weight:500;margin:0 0 1.25rem;line-height:1.2}
h2::before{content:"¶";color:var(--rubric);margin-right:.45rem;font-weight:400}
h3{font-family:var(--sans);font-size:1.05rem;font-weight:700;color:var(--muted);margin:2rem 0 .75rem}

.list{list-style:none;margin:0;padding:0}
.e{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:1rem;padding:.6rem 0;border-top:1px solid var(--rule)}
.e:first-child{border-top:0}
.y{font-family:var(--sans);font-size:.95rem;color:var(--rubric);padding-top:.15rem;font-variant-numeric:oldstyle-nums tabular-nums}
.t{margin:0;overflow-wrap:anywhere}
.d{margin:.15rem 0 0;color:var(--muted);font-size:1rem;overflow-wrap:anywhere}
.lk{display:flex;flex-wrap:wrap;gap:.2rem 1rem;margin:.3rem 0 0;font-family:var(--sans);font-size:.95rem}
.lk a{overflow-wrap:anywhere}
.t em{font-style:italic}
.kind{font-family:var(--sans);font-size:.85rem;color:var(--muted);background:var(--chip);padding:.05rem .45rem;border-radius:3px;margin-left:.35rem;white-space:nowrap}

/* Filtro de publicaciones */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0 0 1.25rem;font-family:var(--sans)}
.filters button{font:inherit;font-size:.95rem;background:var(--chip);border:1px solid transparent;color:var(--ink);padding:.3rem .75rem;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters input{font:inherit;font-size:1rem;flex:1 1 14rem;min-width:0;padding:.4rem .7rem;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px}
.count{font-family:var(--sans);font-size:.95rem;color:var(--muted);margin:0 0 .5rem}
.empty{color:var(--muted);font-style:italic}

.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem}
.lang{border-top:2px solid var(--rubric);padding-top:.5rem}
.lang b{display:block;font-weight:700}
.lang span{color:var(--muted);font-size:1rem}

footer{margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--rule);font-family:var(--sans);font-size:.95rem;color:var(--muted)}

/* Móvil y tabletas */
@media (max-width:52rem){
  .layout{grid-template-columns:minmax(0,1fr)}
  .tabula{position:sticky;top:0;z-index:10;height:auto;overflow:visible;

    border-right:0;border-bottom:1px solid var(--rule);background:var(--bg)}

  .tabula .sig{margin:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tabula .sig small{display:none}
  .tools{margin:0;flex-direction:row;grid-column:2;grid-row:1}
  .tabula .sig{grid-column:1;grid-row:1}
  .tools .print{display:none}
  .btn{padding:.3rem .6rem;font-size:.9rem}
  .tabula nav{grid-column:1 / -1;grid-row:2;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -1rem;padding:0 1rem}
  .tabula nav::-webkit-scrollbar{display:none}
  .tabula ol{display:flex;gap:.15rem;white-space:nowrap;width:max-content}
  .tabula li a{border-left:0;border-bottom:2px solid transparent;padding:.35rem .5rem}
  .tabula li a[aria-current="true"]{border-bottom-color:var(--rubric)}
  main{padding:1.75rem 1.1rem 4rem}
  .col{max-width:none}
  .hero h1{font-size:clamp(1.9rem,8.5vw,2.6rem)}
  .hero .role{font-size:1.1rem}
  .hero-photo{width:5.5rem;height:5.5rem}
  .resume p:first-child::first-letter{font-size:3.4rem}
  h2{font-size:1.45rem}
  section{padding-top:2rem;scroll-margin-top:5.5rem}
  .e{grid-template-columns:minmax(0,1fr);gap:.1rem;padding:.7rem 0}
  .filters input{flex:1 1 100%}
  body{font-size:1.0625rem}

@media print{
  .tabula,.filters,.count,footer .noprint{display:none!important}
  .layout{display:block}
  main{padding:0}
  body{background:#fff;color:#000;font-size:11pt}
  section{padding-top:1.2rem;break-inside:auto}
  .e{break-inside:avoid}
  a{color:#000;text-decoration:none}
}

        <button type="button" data-f="todas" aria-pressed="true">Todas</button>
        ${Object.entries(TIPOS).map(([k,v]) => `<button type="button" data-f="${k}" aria-pressed="false">${v}</button>`).join("")}
        <input type="search" id="q" placeholder="Buscar por título, revista o año" aria-label="Buscar publicaciones">
      </div>
      <p class="count" id="count" aria-live="polite"></p>
      <ol class="list" id="pubs"></ol>`),
    sec("ponencias","Ponencias y eventos", `<h3>Ponencias presentadas</h3>` + list(c.ponencias) + `<h3>Participación en eventos</h3>` + list(c.eventos)),
    sec("evaluacion","Evaluación y extensión", `<h3>Evaluación y gestión editorial</h3>` + list(c.evaluacion) + `<h3>Actividades de extensión</h3>` + list(c.extension)),
    sec("membresias","Membresías y redes", list(c.membresias)),
    sec("trayectoria","Trayectoria previa", `<h3>Docencia y otros antecedentes laborales</h3>` + list(c.previa) + `<h3>Actividades profesionales</h3>` + list(c.profesionales)),
    sec("idiomas","Idiomas", `<div class="langs">${c.idiomas.map(i => `<div class="lang"><b>${i.n}</b><span>${i.nivel}. ${i.d}</span></div>`).join("")}</div>`)
  ].join("");

  document.getElementById("content").innerHTML = html;
  document.getElementById("updated").textContent = `Última actualización: ${c.actualizado}.`;
  document.getElementById("toc").innerHTML = SECCIONES.map(([id,t]) => `<li><a href="#${id}">${t}</a></li>`).join("");
}

function pubs(){
  let filtro = "todas";
  const box = document.getElementById("pubs"), q = document.getElementById("q"), count = document.getElementById("count");
  const strip = s => s.replace(/<[^>]+>/g,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const draw = () => {
    const term = strip(q.value.trim());
    const items = CV.publicaciones
      .filter(p => filtro === "todas" || p.tipo === filtro)
      .filter(p => !term || strip(p.t + " " + p.y).includes(term))
      .sort((a,b) => b.y - a.y);
    count.textContent = `${items.length} ${items.length === 1 ? "publicación" : "publicaciones"}`;
    box.innerHTML = items.length ? items.map(p => `
      <li class="e"><span class="y">${p.y}</span>
        <div><p class="t">${p.t}${filtro === "todas" ? `<span class="kind">${ETIQ[p.tipo]}</span>` : ""}</p>
        ${lk(p.links)}</div></li>`).join("")
      : `<li class="empty">No hay publicaciones que coincidan con la búsqueda. Probá con otro término o elegí “Todas”.</li>`;
  };
  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    filtro = b.dataset.f;
    document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
    draw();
  }));
  q.addEventListener("input", draw);
  draw();
}

function navSpy(){
  const anchors = [...document.querySelectorAll("#toc a")];
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){
        anchors.forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + en.target.id));
        const act = anchors.find(a => a.getAttribute("aria-current") === "true");
        const nav = document.querySelector(".tabula nav");
        if (act && nav && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: act.offsetLeft - nav.clientWidth / 2 + act.offsetWidth / 2, behavior: "smooth" });
      }
    });
  }, { rootMargin:"-30% 0px -65% 0px" });
  document.querySelectorAll("#inicio, section[id]").forEach(s => io.observe(s));
}

function theme(){
  const root = document.documentElement, btn = document.getElementById("theme");
  try { const t = localStorage.getItem("cv-theme"); if (t) root.dataset.theme = t; } catch(e){}
  btn.addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("cv-theme", root.dataset.theme); } catch(e){}
  });
}

render(); pubs(); navSpy(); theme();
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
